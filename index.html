<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oleksiy Babich — Personal Homepage</title>
  <meta name="description" content="Oleksiy Babich — an addictive feeling of comfort">
  <meta property="og:title" content="Oleksiy Babich">
  <meta property="og:description" content="An addictive feeling of comfort">
  <meta property="og:type" content="website">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background-color: #2a2128;
      background-repeat: no-repeat;
      background-position: top center;
      background-size: cover;
      background-attachment: fixed;
      background-image: url('images/bg/window.640.jpg');
      background-image: image-set(
        url('images/bg/window.640.webp') type('image/webp'),
        url('images/bg/window.640.jpg') type('image/jpeg')
      );
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.7em;
      color: #fff;
      letter-spacing: 1px;
      line-height: 1.3;
    }

    @media (min-width: 641px) {
      body {
        background-image: url('images/bg/window.1280.jpg');
        background-image: image-set(
          url('images/bg/window.1280.webp') type('image/webp'),
          url('images/bg/window.1280.jpg') type('image/jpeg')
        );
      }
    }

    @media (min-width: 1281px) {
      body {
        background-image: url('images/bg/window.1440.jpg');
        background-image: image-set(
          url('images/bg/window.1440.webp') type('image/webp'),
          url('images/bg/window.1440.jpg') type('image/jpeg')
        );
      }
    }

    @media (min-width: 1441px) {
      body {
        background-image: url('images/bg/window.1680.jpg');
        background-image: image-set(
          url('images/bg/window.1680.webp') type('image/webp'),
          url('images/bg/window.1680.jpg') type('image/jpeg')
        );
      }
    }

    @media (min-width: 1681px) {
      body {
        background-image: url('images/bg/window.1920.jpg');
        background-image: image-set(
          url('images/bg/window.1920.webp') type('image/webp'),
          url('images/bg/window.1920.jpg') type('image/jpeg')
        );
      }
    }

    @media (min-width: 1921px) {
      body {
        background-image: url('images/bg/window.2560.jpg');
        background-image: image-set(
          url('images/bg/window.2560.webp') type('image/webp'),
          url('images/bg/window.2560.jpg') type('image/jpeg')
        );
      }
    }

    .dialog {
      position: fixed;
      bottom: 20px;
      left: 0;
      width: 100%;
      text-align: center;
    }

    .tagline {
      font-weight: bold;
      margin-bottom: 0.5em;
    }
  </style>
</head>
<body>
  <main class="dialog" role="contentinfo">
    <p class="tagline">an addictive feeling of comfort</p>
    <p>&copy; Oleksiy Babich, 2002&ndash;2026</p>
  </main>
</body>
</html>
